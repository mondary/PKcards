<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Score — compteur de points</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20512%20512%22%3E%0A%20%20%3Crect%20width%3D%22512%22%20height%3D%22512%22%20fill%3D%22%23faf8f4%22%2F%3E%0A%20%20%3Cg%20stroke%3D%22%232050c8%22%20stroke-width%3D%2236%22%20stroke-linecap%3D%22round%22%3E%0A%20%20%20%20%3Cline%20x1%3D%22156%22%20y1%3D%22148%22%20x2%3D%22156%22%20y2%3D%22364%22%2F%3E%0A%20%20%20%20%3Cline%20x1%3D%22228%22%20y1%3D%22148%22%20x2%3D%22228%22%20y2%3D%22364%22%2F%3E%0A%20%20%20%20%3Cline%20x1%3D%22300%22%20y1%3D%22148%22%20x2%3D%22300%22%20y2%3D%22364%22%2F%3E%0A%20%20%20%20%3Cline%20x1%3D%22372%22%20y1%3D%22148%22%20x2%3D%22372%22%20y2%3D%22364%22%2F%3E%0A%20%20%20%20%3Cline%20x1%3D%22112%22%20y1%3D%22342%22%20x2%3D%22416%22%20y2%3D%22170%22%2F%3E%0A%20%20%3C%2Fg%3E%0A%3C%2Fsvg%3E%0A">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --paper:#faf8f4; --ink:#1c1b18; --line:#ddd8ce; --mut:#8a857a; --acc:#2050c8;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  height:100dvh; display:flex; flex-direction:overflow; touch-action:manipulation;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer; touch-action:manipulation}
button:disabled{opacity:.3; pointer-events:none}

#app{
  max-width:640px; width:100%; margin:0 auto; height:100dvh;
  display:flex; flex-direction:column; overflow:hidden;
}
#scoreView{display:flex;flex:1;min-height:0;flex-direction:column}
#scoreView[hidden],#tablesView[hidden]{display:none}

/* ----- accueil : les tables ----- */
#tablesView{flex:1;overflow-y:auto;padding:calc(env(safe-area-inset-top) + 20px) 18px calc(env(safe-area-inset-bottom) + 24px);background:#f2efe8}
.tablesTop{margin-bottom:26px}.tablesTop .ey{margin:0 0 5px;color:var(--mut);font-size:11px;font-weight:700;letter-spacing:.11em;text-transform:uppercase}.tablesTop h1{margin:0;font-size:34px;letter-spacing:-1.4px}.tablesIntro{margin:0 0 22px;color:var(--mut);font-size:14px;line-height:1.4}.tableCards{display:grid;gap:13px}.tableCard{position:relative;overflow:hidden;min-height:150px;border-radius:20px;padding:18px;background:#264d8d;color:#fff;box-shadow:0 8px 18px rgba(30,43,67,.16)}.tableCard::after{content:'';position:absolute;right:-37px;bottom:-55px;width:175px;height:175px;border:1px solid rgba(255,255,255,.3);border-radius:50%;box-shadow:0 0 0 24px rgba(255,255,255,.06),0 0 0 49px rgba(255,255,255,.04)}.tableCard.c1{background:#2050c8}.tableCard.c2{background:#a84649}.tableCard.c3{background:#267560}.tableCard.c4{background:#7052a1}.tableCard>*{position:relative;z-index:1}.tableCard .tmeta{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;opacity:.72}.tableCard h2{margin:7px 0 7px;font-size:25px;letter-spacing:-.7px}.tableCard .tstate{font-size:14px;opacity:.93}.avatars{display:flex;margin-top:16px}.avatar{display:grid;place-items:center;width:29px;height:29px;margin-right:-6px;border:2px solid rgba(255,255,255,.85);border-radius:50%;background:#f5e7c7;color:var(--ink);font-size:10px;font-weight:800;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.tableCard .resume{position:absolute;right:15px;bottom:16px;border-radius:999px;padding:9px 12px;background:#fff;color:var(--ink);font-size:12px;font-weight:800}.tableTools{position:absolute;right:14px;top:13px;display:flex;gap:3px}.tableTools button{width:29px;height:29px;border-radius:9px;background:rgba(255,255,255,.15);color:#fff;font-size:13px}.tableTools button:active{background:rgba(255,255,255,.32)}.tableAddRow{display:flex;align-items:center;gap:12px;width:100%;margin-top:4px;padding:10px;border-radius:14px;color:var(--mut);text-align:left}.tableAddRow .addMark{display:grid;place-items:center;width:46px;height:46px;border:1.5px dashed #c9c3b6;border-radius:14px;color:#c9c3b6;font-size:18px}.tableAddRow span:last-child{font-size:15px}.tableAddRow:active{background:#e8e4db;color:var(--ink)}.tablesEmpty{padding:48px 6px;text-align:center;color:var(--mut)}

/* ----- entête de liste ----- */
#listHead{
  display:flex; align-items:center; gap:8px;
  padding:2px 0 10px;
}
#listHead b{font-size:15px}
#listHead .grow{flex:1}
.tableName{max-width:145px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini{
  height:30px; padding:0 10px; border-radius:8px; border:1px solid var(--line);
  font-size:12.5px; font-weight:600; background:#fff;
}
.mini:active{background:var(--ink); color:#fff}
#listHead{
  display:flex; align-items:center; gap:8px;
  padding:2px 0 10px;
}
#listHead b{font-size:15px}
#listHead .grow{flex:1}

/* ----- liste des joueurs ----- */
#list{flex:1; overflow-y:auto; padding:calc(env(safe-area-inset-top) + 10px) 14px 10px; -webkit-overflow-scrolling:touch}
.prow{
  display:flex; align-items:stretch;
  padding:0; margin:0 -14px; border-radius:14px;
}
.prow.sel{background:#eef1fb}
.init{
  width:64px; min-height:64px; flex:none; align-self:stretch;
  display:grid; place-items:center; font-weight:700; font-size:16px;
  background:#eceae4; overflow:hidden; position:relative;
  border-radius:14px 0 0 14px;
}
.init.ph{padding:0; border:0; object-fit:cover; display:block; width:64px; height:auto}
.pmid{
  flex:1; min-width:0; display:flex; flex-direction:column; justify-content:center;
  padding:9px 4px 9px 12px;
}
.prow.sel .init{background:var(--acc); color:#fff}
.pmid{flex:1; min-width:0}
.pnm{
  display:block; font-size:16px; font-weight:600; text-align:left;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; padding:2px 0;
}
.pnameLine{display:flex;align-items:center;gap:4px;min-width:0}
.pnameLine .pnm{flex:1;min-width:0}
.ren{
  width:25px;height:25px;flex:none;border:1px solid transparent;border-radius:7px;
  color:var(--mut);font-size:13px;line-height:1;
}
.ren:active{border-color:var(--acc);color:var(--acc);background:#fff}
.pbd{
  display:grid; grid-template-columns:repeat(auto-fill,minmax(42px,1fr)); gap:4px;
  width:100%; margin-top:6px; color:var(--mut); font-size:13px;
  line-height:1.25; font-variant-numeric:tabular-nums;
}
.pbd:empty{display:none}
.pbd [data-fix]{
  min-width:0; padding:4px 3px; border-radius:6px; text-align:center;
  border:1px dashed #c9c3b6; white-space:nowrap;
}
.pbd [data-fix]:active{color:var(--acc); border-color:var(--acc)}
.pbd small{display:block;margin-bottom:1px;font-size:9px;font-weight:700;letter-spacing:.04em;color:#aaa398}
.tot{font-size:30px; font-weight:800; font-variant-numeric:tabular-nums; letter-spacing:-.5px; align-self:center; padding-right:8px}
.rx{color:#c9c3b6; font-size:15px; padding:8px; margin-right:4px; align-self:center}
.rx:active{color:#b3261e}

#addRow{
  display:flex; align-items:center; gap:12px; width:100%;
  padding:10px 10px; margin:0 -14px; border-radius:14px; color:var(--mut);
}
#addRow .init{
  width:46px; min-height:46px; align-self:center; border-radius:14px;
  border:1.5px dashed #c9c3b6; background:none; color:#c9c3b6; font-size:18px;
}
#addRow span{font-size:15px}
#addRow:active{background:#f1eee7; color:var(--ink)}

/* ----- pavé permanent ----- */
#pad{
  border-top:1px solid var(--line); background:#fff;
  padding:8px 12px calc(env(safe-area-inset-bottom) + 8px);
}
#padBar{display:flex; align-items:center; gap:9px; padding:0 2px 8px}
.padAvatar{width:35px;height:35px;flex:none;display:grid;place-items:center;overflow:hidden;border-radius:50%;background:#e7e4dc;color:var(--ink);font-size:11px;font-weight:800;letter-spacing:.02em}
.padAvatar img{width:100%;height:100%;object-fit:cover}
#padWho{flex:1; min-width:0; text-align:left}
#padWho small{display:block;margin-bottom:1px;color:var(--mut);font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
#padWho b{font-size:15px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
#padVal{
  font-size:24px; font-weight:800; font-variant-numeric:tabular-nums;
  min-width:70px; text-align:right; letter-spacing:.5px; white-space:nowrap;
}
#padVal.long{font-size:17px}
#padVal:empty::after{content:"—"; color:#c9c3b6; font-weight:400}
#pgrid{display:grid; grid-template-columns:repeat(4,1fr); gap:6px}
#pgrid button{
  height:46px; border:1px solid var(--line); border-radius:11px;
  font-size:20px; font-weight:600; background:var(--paper);
}
#pgrid button:active{background:var(--ink); color:#fff; border-color:var(--ink)}
#pgrid .fn{color:var(--mut); font-size:17px}
#pgrid #undoBtn,#pgrid #redoBtn{border-color:var(--line)}
#pgrid #undoBtn.attn,#pgrid #redoBtn.attn{border-color:var(--acc); color:var(--acc)}
#pgrid #padOk{
  grid-column:span 2; background:var(--acc); color:#fff; border-color:var(--acc);
  font-size:15.5px;
}
#pgrid #padOk:active{background:var(--ink); border-color:var(--ink)}
#pgrid #padOk.fix{background:var(--ink); border-color:var(--ink)}

/* ----- overlays ----- */
.ov{
  position:fixed; inset:0; z-index:30; background:rgba(28,27,24,.45);
  display:grid; place-items:center; padding:20px;
}
.ov[hidden]{display:none}
.sheet{
  width:100%; max-width:380px; background:#fff; border-radius:18px;
  padding:20px 18px 16px; max-height:80dvh; overflow-y:auto;
}
.sheet h2{margin:0 0 4px; font-size:20px}
.sheet .sub2{color:var(--mut); font-size:13.5px; margin:0 0 14px}
.rline{
  display:flex; align-items:center; gap:10px; padding:10px 2px;
  border-bottom:1px solid var(--line); font-size:15px;
}
.rline:last-of-type{border-bottom:0}
.rline .w{flex:1; font-weight:600}
.rline .c{color:var(--mut); font-size:13px}
.rline .v{font-weight:800; font-variant-numeric:tabular-nums}
.rline.win .w::after{content:" 🏆"}
.sheet .btns{display:flex; flex-direction:column; gap:8px; margin-top:14px}
.bmain{padding:14px; border-radius:12px; background:var(--acc); color:#fff; font-weight:600; font-size:15.5px}
.bmain:active{background:var(--ink)}
.bghost{padding:12px; border-radius:12px; border:1px solid var(--line); color:var(--mut); font-size:14.5px}

#toast{
   position:fixed; bottom:calc(env(safe-area-inset-bottom) + 310px); left:50%;
   transform:translateX(-50%); background:var(--ink); color:#fff;
   padding:9px 16px; border-radius:8px; font-size:14px; font-weight:600;
   opacity:0; pointer-events:none; transition:opacity .2s, bottom .1s; z-index:40; white-space:nowrap;
 }
 #toast.on{opacity:1}

@media (min-width:600px){
  #list{display:grid; grid-template-columns:1fr 1fr; align-content:start; gap:2px 10px}
  .tot{font-size:34px}
}
</style>
</head>
<body>
<div id="app">
  <section id="tablesView"></section>
  <section id="scoreView" hidden>
    <div id="list"></div>
    <div id="pad">
      <div id="padBar">
        <span id="pwAvatar" class="padAvatar" aria-hidden="true"></span>
        <button id="padWho"><small>Points pour</small><b id="pwName"></b></button>
        <span id="padVal"></span>
      </div>
      <div id="pgrid">
        <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button><button data-k="b" class="fn">⌫</button>
        <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button><button data-k="s" class="fn">−</button>
        <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button><button id="undoBtn" class="fn" title="Annuler la dernière saisie du joueur">↩</button>
      <button data-k="0">0</button><button id="redoBtn" class="fn" title="Rétablir la dernière saisie annulée">↪</button>
      <button id="padOk">Valider</button>
      </div>
    </div>
  </section>
</div>

<div id="ovEnd" class="ov" hidden></div>
<div id="ovPal" class="ov" hidden></div>
<div id="ovMenu" class="ov" hidden></div>
<div id="toast"></div>

<script>
'use strict';
var LEGACY_KEY='pk.score.v3', LEGACY_GKEY='pk.score.games', TABLEKEY='pk.score.tables.v1';
var STORE=loadStore(), S=activeTable().state, GAMES=activeTable().games;
var SEL=null, CUR='', FIX=null, toastT=0;

function lsGet(k){if(location.protocol==='file:')return null;try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){if(location.protocol==='file:')return;try{localStorage.setItem(k,v)}catch(e){}}
function freshState(){
  return {players:[
    {id:uid(),name:'Joueur 1'},
    {id:uid(),name:'Joueur 2'},
    {id:uid(),name:'Joueur 3'}
  ],rounds:[],log:[],redo:[]};
}
function loadStore(){
  try{var s=JSON.parse(lsGet(TABLEKEY)||'null');if(s&&Array.isArray(s.tables)&&s.tables.length)return s}catch(e){}
  var legacy=null,games=[];
  try{legacy=JSON.parse(lsGet(LEGACY_KEY)||'null')}catch(e){}
  try{games=JSON.parse(lsGet(LEGACY_GKEY)||'[]');if(!Array.isArray(games))games=[]}catch(e){}
  return {activeId:'table-1',tables:[{id:'table-1',name:'Table 1',state:(legacy&&legacy.players?legacy:freshState()),games:games}]};
}
function activeTable(){for(var i=0;i<STORE.tables.length;i++)if(STORE.tables[i].id===STORE.activeId)return STORE.tables[i];STORE.activeId=STORE.tables[0].id;return STORE.tables[0]}
function save(){activeTable().state=S;activeTable().games=GAMES;lsSet(TABLEKEY,JSON.stringify(STORE))}
function saveGames(){save()}
function uid(){return Math.random().toString(36).slice(2,9)}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function ini(n){
  var m=/^(.*?)\s*(\d+)$/.exec(n.trim());
  if(m)return (m[1].charAt(0).toUpperCase()+m[2]).slice(0,3);
  var w=n.trim().split(/\s+/);
  return (w[0].charAt(0)+(w[1]?w[1].charAt(0):'')).toUpperCase();
}
function P(id){for(var i=0;i<S.players.length;i++)if(S.players[i].id===id)return S.players[i]}
function tot(pid){var t=0;S.rounds.forEach(function(r){t+=r.scores[pid]||0});return t}
function curRound(){
  var r=S.rounds[S.rounds.length-1];
  if(!r||r.done)return null;
  return r;
}
function roundNo(){return S.rounds.length?(curRound()?S.rounds.length:S.rounds.length+1):1}
function commit(pid,v,ridx){
  var prev;
  if(ridx!=null){
    prev=(pid in S.rounds[ridx].scores)?S.rounds[ridx].scores[pid]:null;
    S.rounds[ridx].scores[pid]=v;
  }else{
    var r=curRound();
    if(!r){r={scores:{},done:false};S.rounds.push(r)}
    prev=(pid in r.scores)?r.scores[pid]:null;
    r.scores[pid]=v;
    ridx=S.rounds.length-1;
  }
  var rr=S.rounds[ridx];
  if(S.solo){
    S.players.forEach(function(p){
      if(p.id!==pid&&!(p.id in rr.scores)){
        rr.scores[p.id]=0;
        S.log.push({pid:p.id,ridx:ridx,prev:null,value:0});
      }
    });
  }
  rr.done=S.players.every(function(p){return p.id in rr.scores});
  S.log.push({pid:pid,ridx:ridx,prev:prev,value:v});
  if(S.log.length>200)S.log.shift();
  S.redo=[];
  save();
}
function parseVal(e){if(e===''||e==='-')return null;var n=parseInt(e,10);return isNaN(n)?null:n}
function nextMissing(fromPid){
  var r=curRound();if(!r)return null;
  var ids=S.players.map(function(p){return p.id});
  var i=fromPid?ids.indexOf(fromPid)+1:0;
  for(var k=i;k<ids.length;k++)if(!(ids[k] in r.scores))return ids[k];
  for(var j=0;j<ids.length;j++)if(!(ids[j] in r.scores))return ids[j];
  return null;
}

function render(){
  var list=document.getElementById('list');
  var cur=curRound();
  var h='<div id="listHead"><button class="mini tableName" id="btnTables" title="Changer de table">⌘ '+esc(activeTable().name)+'</button><b>Manche '+roundNo()+'</b><span class="grow"></span>'
    +'<button class="mini" id="btnPal">🏆 Palmarès</button>'
    +'<button class="mini" id="btnMenu">Menu</button></div>';
  h+=S.players.map(function(p){
    var segs=[];
    S.rounds.forEach(function(r,i){
      if(!(p.id in r.scores))return;
      var v=r.scores[p.id];
      segs.push('<span data-fix="'+i+'" data-pid="'+p.id+'"><small>M'+(i+1)+'</small>'
        +(v<0?'−'+Math.abs(v):v)+'</span>');
    });
    return '<div class="prow'+(SEL===p.id?' sel':'')+'" data-pid="'+p.id+'">'
      +(p.photo
        ?'<img class="init ph" data-photo="'+p.id+'" src="'+p.photo+'" alt="">'
        :'<button class="init noph" data-photo="'+p.id+'" title="Photo">'+esc(ini(p.name))+'</button>')
      +'<span class="pmid"><span class="pnameLine"><span class="pnm">'+esc(p.name)+'</span><button class="ren" data-ren="'+p.id+'" title="Renommer '+esc(p.name)+'" aria-label="Renommer '+esc(p.name)+'">✎</button></span>'
      +(segs.length?'<span class="pbd">'+segs.join('')+'</span>':'')
      +'</span>'
      +'<span class="tot">'+tot(p.id)+'</span>'
      +'<button class="rx" data-rm="'+p.id+'" title="Retirer">✕</button>'
      +'</div>';
  }).join('');
  h+='<button id="addRow" data-act="add"><span class="init">＋</span><span>Ajouter un joueur</span></button>';
  list.innerHTML=h;
  document.getElementById('undoBtn').className=S.log.length?'fn attn':'fn';
  document.getElementById('redoBtn').className=(S.redo&&S.redo.length)?'fn attn':'fn';
  syncPad();
}
function entryVal(){return parseVal(CUR)}
function entryText(){return CUR.replace('-','−')}
function clearEntry(){CUR=''}
function setEntry(v){CUR=String(v===null||v===undefined?'':v)}
function syncPad(){
  var p=P(SEL);
  document.getElementById('pwName').textContent=p?(p.name+(FIX!=null?' — modifier M'+(FIX+1):'')):'';
  document.getElementById('pwAvatar').innerHTML=p
    ?(p.photo?'<img src="'+esc(p.photo)+'" alt="">':esc(ini(p.name)))
    :'';
  var pv=document.getElementById('padVal');
  pv.textContent=entryText();
  pv.className=entryText().length>6?'long':'';
  var action='Ajouter';
  if(FIX!=null)action='Modifier M'+(FIX+1);
  else if(entryText())action='Ajouter '+(CUR.charAt(0)==='-'?'':'＋')+entryText();
  document.getElementById('padOk').textContent=action;
  document.getElementById('padOk').className=FIX!=null?'fix':'';
}
function toast(m){
  var t=document.getElementById('toast');
  t.textContent=m;t.classList.add('on');
  clearTimeout(toastT);
  var kbH=0;
  if(window.visualViewport&&window.visualViewport.height<window.innerHeight)
    kbH=Math.round(window.innerHeight-window.visualViewport.height);
  var base=310+(kbH||0);
  t.style.bottom='calc(env(safe-area-inset-bottom) + '+base+'px)';
  toastT=setTimeout(function(){t.classList.remove('on')},1700);
}

/* ----- sélection & saisie ----- */
function curRoundVal(pid){
  var r=curRound();
  return (r&&pid in r.scores)?r.scores[pid]:null;
}
function select(pid,fixIdx){
  var v=entryVal();
  if(SEL&&!FIX&&v!==null&&SEL!==pid){
    commit(SEL,v);toast(P(SEL).name+' : '+v);
  }
  SEL=pid;FIX=(fixIdx!=null)?fixIdx:null;
  if(fixIdx!=null)setEntry(S.rounds[fixIdx].scores[pid]||0);
  else{
    var c=curRoundVal(pid);
    if(c!==null){FIX=S.rounds.length-1;setEntry(c)}
    else setEntry(null);
  }
  render();
}
function padKey(k){
  if(/^[0-9]$/.test(k))CUR=(CUR==='0'?k:CUR==='-'?'-'+k:CUR+k).slice(0,7);
  else if(k==='b')CUR=CUR.slice(0,-1);
  else if(k==='s'){
    if(CUR==='')CUR='-';
    else CUR=CUR.charAt(0)==='-'?CUR.slice(1):'-'+CUR;
  }
  syncPad();
}
function padOk(){
  var v=entryVal();
  if(v===null){toast('Tape un score (0 compris)');return}
  if(FIX!=null){
    commit(SEL,v,FIX);
    toast('Corrigé : '+v);
    FIX=null;clearEntry();
  }else{
    commit(SEL,v);
    toast(P(SEL).name+' : '+v);
    var n=nextMissing(SEL);
    if(n){SEL=n;setEntry(curRoundVal(n)!==null?curRoundVal(n):null)}
    else{
      if(!S.solo)toast('Manche '+S.rounds.length+' complète ✓');
      SEL=nextMissing(null);clearEntry();
      if(!SEL&&S.players.length)SEL=S.players[0].id;
    }
  }
  render();
}
function undo(){
  if(!SEL){toast('Sélectionne un joueur');return}
  var idx=-1;
  for(var i=S.log.length-1;i>=0;i--)if(S.log[i].pid===SEL){idx=i;break}
  if(idx<0){toast('Rien à annuler pour '+P(SEL).name);return}
  var a=S.log.splice(idx,1)[0];
  var r=S.rounds[a.ridx];
  if(r){
    if(a.value===undefined)a.value=r.scores[a.pid];
    if(a.prev===null||a.prev===undefined)delete r.scores[a.pid];
    else r.scores[a.pid]=a.prev;
    if(!Object.keys(r.scores).length)S.rounds.splice(a.ridx,1);
    else r.done=false;
  }
  if(!S.redo)S.redo=[];
  S.redo.push(a);
  save();
  FIX=null;clearEntry();
  render();toast('Annulé — '+P(SEL).name);
}
function redo(){
  if(!SEL){toast('Sélectionne un joueur');return}
  var stack=S.redo||[],idx=-1;
  for(var i=stack.length-1;i>=0;i--)if(stack[i].pid===SEL){idx=i;break}
  if(idx<0){toast('Rien à rétablir pour '+P(SEL).name);return}
  var a=stack.splice(idx,1)[0],r=S.rounds[a.ridx];
  if(!r){r={scores:{},done:false};S.rounds.splice(a.ridx,0,r)}
  r.scores[a.pid]=a.value;
  r.done=S.players.every(function(p){return p.id in r.scores});
  S.log.push(a);
  if(S.log.length>200)S.log.shift();
  save();
  FIX=null;clearEntry();
  render();toast('Rétabli — '+P(SEL).name);
}

/* ----- fin de partie & palmarès ----- */
function endGame(){
  if(!S.rounds.length)return;
  var st=S.players.map(function(p){return{name:p.name,s:tot(p.id)}}).sort(function(a,b){return b.s-a.s});
  var best=st[0].s;
  GAMES.push({d:Date.now(),w:st.filter(function(x){return x.s===best}).map(function(x){return x.name}),s:st});
  if(GAMES.length>60)GAMES.shift();
  saveGames();
  var ov=document.getElementById('ovEnd');
  ov.innerHTML='<div class="sheet"><h2>Partie terminée</h2>'
    +'<p class="sub2">'+esc(GAMES.length)+' partie'+(GAMES.length>1?'s':'')+' au palmarès</p>'
    +st.map(function(x,i){return '<div class="rline'+(x.s===best?' win':'')+'"><span class="c">'+(i+1)+'</span><span class="w">'+esc(x.name)+'</span><span class="v">'+x.s+'</span></div>'}).join('')
    +'<div class="btns"><button class="bmain" data-e="again">Rejouer (mêmes joueurs)</button>'
    +'<button class="bghost" data-e="close">Fermer</button></div></div>';
  ov.hidden=false;
}
function palmares(){
  var ov=document.getElementById('ovPal');
  var wins={},n=GAMES.length;
  GAMES.forEach(function(g){g.w.forEach(function(w){wins[w]=(wins[w]||0)+1})});
  var rows=Object.keys(wins).sort(function(a,b){return wins[b]-wins[a]})
    .map(function(w){return '<div class="rline"><span class="w">'+esc(w)+'</span><span class="v">'+wins[w]+' victoire'+(wins[w]>1?'s':'')+'</span></div>'});
  ov.innerHTML='<div class="sheet"><h2>Palmarès</h2>'
    +'<p class="sub2">'+n+' partie'+(n>1?'s':'')+' jouée'+(n>1?'s':'')+'</p>'
    +(rows.length?rows.join(''):'<p class="sub2">Termine une partie (🏁) pour alimenter le palmarès.</p>')
    +'<div class="btns"><button class="bghost" data-p="wipe">Effacer le palmarès</button>'
    +'<button class="bmain" data-p="close">Fermer</button></div></div>';
  ov.hidden=false;
}

function pickPhoto(pid){
  var inp=document.createElement('input');
  inp.type='file';inp.accept='image/*';inp.capture='environment';
  inp.onchange=function(){
    var f=inp.files&&inp.files[0];if(!f)return;
    var url=URL.createObjectURL(f);
    var img=new Image();
    img.onload=function(){
      try{
        var s=112,c=document.createElement('canvas');
        c.width=s;c.height=s;
        var ctx=c.getContext('2d');
        var m=Math.min(img.width,img.height);
        ctx.drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,s,s);
        P(pid).photo=c.toDataURL('image/jpeg',.72);
        save();
      }catch(e){}
      URL.revokeObjectURL(url);
      render();
    };
    img.onerror=function(){URL.revokeObjectURL(url)};
    img.src=url;
  };
  inp.click();
}

function openMenu(){
  var ov=document.getElementById('ovMenu');
  ov.innerHTML='<div class="sheet"><h2>Menu</h2>'
    +'<p class="sub2">Partie en cours : manche '+Math.max(1,S.rounds.length)+'</p>'
    +'<div class="btns">'
    +'<button class="bmain" data-m="end"'+(S.rounds.length?'':' disabled')+'>🏁 Terminer la partie<small style="display:block;font-weight:400;font-size:12px;opacity:.85">classement final + victoire au palmarès</small></button>'
    +'<button class="bghost" data-m="solo">'+(S.solo?'✓ ':'')+'Un seul marque par manche<small style="display:block;font-weight:400;font-size:12px;opacity:.85">'+(S.solo?'activé — ':'')+'les autres joueurs marquent 0 automatiquement</small></button>'
    +'<button class="bghost" data-m="reset"'+(S.rounds.length?'':' disabled')+'>⟳ Recommencer à la manche 1</button>'
    +'<button class="bghost" data-m="close">Fermer</button>'
    +'</div></div>';
  ov.hidden=false;
}
function resetRounds(){
  S.rounds=[];S.log=[];S.redo=[];save();
  SEL=S.players.length?S.players[0].id:null;
  clearEntry();FIX=null;
  render();toast('Scores remis à zéro — manche 1');
}

/* ----- tables ----- */
function tableById(id){for(var i=0;i<STORE.tables.length;i++)if(STORE.tables[i].id===id)return STORE.tables[i]}
function tableStatus(t){
  var rs=t.state.rounds||[],last=rs[rs.length-1],open=last&&!last.done;
  if(open)return 'Partie en cours · manche '+rs.length;
  if(rs.length)return 'Prête pour la manche '+(rs.length+1);
  return 'Nouvelle partie';
}
function renderTables(){
  var host=document.getElementById('tablesView'),active=activeTable();
  host.innerHTML='<header class="tablesTop"><p class="ey">Score · vos groupes</p><h1>Les tables</h1></header>'
    +'<p class="tablesIntro">Chaque table garde sa partie, ses joueurs et son palmarès. Reprends exactement où vous vous étiez arrêtés.</p>'
    +'<div class="tableCards">'+STORE.tables.map(function(t,i){
      var people=t.state.players||[],shown=people.slice(0,4),more=people.length-shown.length;
      return '<article class="tableCard c'+(t.c||(i%4+1))+'" data-table-open="'+t.id+'"><span class="tmeta">'+(t.id===active.id?'Table active':'Table')+'</span><h2>'+esc(t.name)+'</h2><p class="tstate">'+tableStatus(t)+'</p><div class="avatars">'+shown.map(function(p){return '<span class="avatar">'+(p.photo?'<img src="'+p.photo+'" alt="">':esc(ini(p.name)))+'</span>'}).join('')+(more?'<span class="avatar">+'+more+'</span>':'')+'</div><div class="tableTools"><button data-table-ren="'+t.id+'" aria-label="Renommer">✎</button><button data-table-del="'+t.id+'" aria-label="Supprimer">✕</button></div><button class="resume">'+(t.id===active.id?'Reprendre':'Ouvrir')+' →</button></article>';
    }).join('')+'</div><button class="tableAddRow" data-table-new><span class="addMark">＋</span><span>Ajouter une table</span></button>';
}
function showTables(){document.getElementById('scoreView').hidden=true;document.getElementById('tablesView').hidden=false;renderTables()}
function showScore(){document.getElementById('tablesView').hidden=true;document.getElementById('scoreView').hidden=false;render()}
function activateTable(id){
  var found=null;for(var i=0;i<STORE.tables.length;i++)if(STORE.tables[i].id===id)found=STORE.tables[i];
  if(!found)return;
  STORE.activeId=id;S=found.state;if(!Array.isArray(S.redo))S.redo=[];GAMES=found.games||[];SEL=S.players.length?S.players[0].id:null;CUR='';FIX=null;save();showScore();toast(found.name+' ouverte');
}
function openTables(){
  showTables();
}
function newTable(){
  var n=prompt('Nom de la table :','Table '+(STORE.tables.length+1));
  if(n===null)return;
  n=n.trim().slice(0,28)||'Table '+(STORE.tables.length+1);
  var t={id:'t-'+uid(),name:n,state:freshState(),games:[],c:(STORE.tables.length%4)+1};STORE.tables.push(t);activateTable(t.id);
}

/* ----- événements ----- */
document.getElementById('list').addEventListener('click',function(e){
  var rm=e.target.closest('[data-rm]');
  if(rm){
    var pid=rm.dataset.rm;
    if(confirm('Retirer '+P(pid).name+' et ses scores ?')){
      S.players=S.players.filter(function(p){return p.id!==pid});
      S.rounds.forEach(function(r){delete r.scores[pid]});
      S.rounds=S.rounds.filter(function(r){return Object.keys(r.scores).length});
      S.log=S.log.filter(function(a){return P(a.pid)});
      S.redo=(S.redo||[]).filter(function(a){return P(a.pid)});
      var lr=S.rounds[S.rounds.length-1];
      if(lr)lr.done=S.players.every(function(p){return p.id in lr.scores});
      if(SEL===pid)SEL=S.players.length?S.players[0].id:null;
      save();render();
    }
    return;
  }
  var ren=e.target.closest('[data-ren]');
  if(ren){
    var pl=P(ren.dataset.ren);
    var v=prompt('Nom du joueur :',pl.name);
    if(v!==null&&v.trim()){pl.name=v.trim().slice(0,14);save();render()}
    return;
  }
  var fx=e.target.closest('[data-fix]');
  if(fx){
    select(fx.dataset.pid);
    return;
  }
  var ad=e.target.closest('[data-act="add"]');
  if(ad){
    if(S.players.length>=10){toast('10 joueurs max');return}
    var nm='Joueur '+(S.players.length+1);
    S.players.push({id:uid(),name:nm});
    save();
    select(S.players[S.players.length-1].id);
    var np=S.players[S.players.length-1];
    var v2=prompt('Nom du joueur :',np.name);
    if(v2!==null&&v2.trim()){np.name=v2.trim().slice(0,14);save()}
    render();
    return;
  }
  var ph=e.target.closest('[data-photo]');
  if(ph){
    var pid=ph.dataset.photo;
    var pl=P(pid);
    if(pl.name.indexOf('Joueur ')===0&&pl.name===('Joueur '+S.players.indexOf(pl)+1)){
      clearEntry();
    }
    pickPhoto(ph.dataset.photo);
    return;
  }
  var row=e.target.closest('.prow[data-pid]');
  if(row)select(row.dataset.pid);
});
var lpTimer=null;
document.getElementById('list').addEventListener('touchstart',function(e){
  var fx=e.target.closest('[data-fix]');
  if(fx){
    var pid=fx.dataset.pid, fix=parseInt(fx.dataset.fix,10);
    lpTimer=setTimeout(function(){select(pid,fix)},500);
  }
},{passive:true});
document.getElementById('list').addEventListener('touchend',function(e){
  if(lpTimer){clearTimeout(lpTimer);lpTimer=null}
},{passive:true});
document.getElementById('list').addEventListener('touchmove',function(e){
  if(lpTimer){clearTimeout(lpTimer);lpTimer=null}
},{passive:true});
document.getElementById('list').addEventListener('contextmenu',function(e){
  var fx=e.target.closest('[data-fix]');
  if(fx){
    e.preventDefault();
    select(fx.dataset.pid,parseInt(fx.dataset.fix,10));
  }
});
document.getElementById('pgrid').addEventListener('click',function(e){
  var k=e.target.closest('[data-k]');
  if(k)padKey(k.dataset.k);
});
document.getElementById('padOk').addEventListener('click',padOk);
document.getElementById('undoBtn').addEventListener('click',undo);
document.getElementById('redoBtn').addEventListener('click',redo);
document.getElementById('list').addEventListener('click',function(e){
  if(e.target.closest('#btnTables')){openTables();return}
  if(e.target.closest('#btnPal')){palmares();return}
  if(e.target.closest('#btnMenu')){openMenu();return}
});
document.getElementById('ovMenu').addEventListener('click',function(e){
  var b=e.target.closest('[data-m]');if(!b)return;
  document.getElementById('ovMenu').hidden=true;
  if(b.dataset.m==='end')endGame();
  else if(b.dataset.m==='solo'){S.solo=!S.solo;save();toast(S.solo?'Un marque par manche — activé':'Un marque par manche — désactivé');openMenu()}
  else if(b.dataset.m==='reset'&&confirm('Effacer toutes les manches et revenir à la manche 1 ?'))resetRounds();
});
document.getElementById('ovEnd').addEventListener('click',function(e){
  var b=e.target.closest('[data-e]');if(!b)return;
  document.getElementById('ovEnd').hidden=true;
  if(b.dataset.e==='again'){
    S.rounds=[];S.log=[];S.redo=[];save();
    SEL=S.players.length?S.players[0].id:null;clearEntry();
    render();toast('Nouvelle partie — mêmes joueurs');
  }
});
document.getElementById('ovPal').addEventListener('click',function(e){
  var b=e.target.closest('[data-p]');if(!b)return;
  if(b.dataset.p==='wipe'&&confirm('Effacer tout le palmarès ?')){GAMES=[];saveGames()}
  document.getElementById('ovPal').hidden=true;
});
document.getElementById('tablesView').addEventListener('click',function(e){
  if(e.target.closest('[data-table-new]')){newTable();return}
  var ren=e.target.closest('[data-table-ren]');
  if(ren){var t=tableById(ren.dataset.tableRen),n=prompt('Nom de la table :',t.name);if(n&&n.trim()){t.name=n.trim().slice(0,28);save();renderTables()}return}
  var del=e.target.closest('[data-table-del]');
  if(del){var d=tableById(del.dataset.tableDel);if(confirm('Supprimer « '+d.name+' » — scores, partie en cours et palmarès ?')){STORE.tables=STORE.tables.filter(function(x){return x.id!==d.id});if(!STORE.tables.length)STORE.tables.push({id:'table-1',name:'Table 1',state:freshState(),games:[]});if(STORE.activeId===d.id){STORE.activeId=STORE.tables[0].id;S=STORE.tables[0].state;GAMES=STORE.tables[0].games||[]}save();renderTables()}return}
  var card=e.target.closest('[data-table-open]');if(card)activateTable(card.dataset.tableOpen);
});
document.addEventListener('keydown',function(e){
  if(document.getElementById('scoreView').hidden)return;
  if(!document.getElementById('ovEnd').hidden||!document.getElementById('ovPal').hidden)return;
  if(/^[0-9]$/.test(e.key))padKey(e.key);
  else if(e.key==='Backspace'){e.preventDefault();padKey('b')}
  else if(e.key==='Enter')padOk();
  else if(e.key==='-')padKey('s');
  else if((e.ctrlKey||e.metaKey)&&(e.key==='y'||(e.shiftKey&&e.key.toLowerCase()==='z'))){e.preventDefault();redo()}
  else if(e.key==='Escape'){FIX=null;clearEntry();render()}
});

/* démarrage : sélectionne le 1er joueur */
SEL=S.players.length?S.players[0].id:null;
showTables();
</script>
</body>
