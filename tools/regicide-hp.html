<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Régicide — Tracker PV</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
:root{--gold:#e8c46a;--red:#e74c3c;--green:#2ecc71;--orange:#f39c12;--bg:#0a0a14}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);background-image:radial-gradient(ellipse at 50% -10%,rgba(232,196,106,.1) 0%,transparent 55%),radial-gradient(ellipse at 10% 90%,rgba(192,57,43,.06) 0%,transparent 50%);min-height:100dvh;color:#e0e0e0;padding-top:env(safe-area-inset-top)}

/* ===== HEADER ===== */
.header{position:sticky;top:0;padding:12px 16px 8px;background:linear-gradient(180deg,rgba(10,10,20,.96),rgba(10,10,20,.6) 90%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);z-index:10;display:flex;align-items:center;justify-content:space-between;gap:10px}
.header h1{font-family:Georgia,serif;font-size:1.15rem;font-weight:400;letter-spacing:5px;text-transform:uppercase;color:var(--gold);white-space:nowrap}
.progress{display:flex;align-items:center;gap:8px;font-size:.7rem;color:#777}
.bar{width:60px;height:3px;background:rgba(255,255,255,.1);border-radius:2px;overflow:hidden}
.bar-fill{height:100%;background:linear-gradient(90deg,#c0392b,var(--gold),var(--green));transition:width .4s}
.reset-btn{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:#888;font-size:.6rem;padding:4px 8px;border-radius:6px;cursor:pointer;letter-spacing:1px}

/* ===== GRID ===== */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;padding:10px 16px 60px;max-width:560px;margin:0 auto}
@media(min-width:480px){.grid{grid-template-columns:repeat(3,1fr);gap:16px}}
@media(min-width:720px){.grid{grid-template-columns:repeat(4,1fr)}}

.gcard{position:relative;border-radius:10px;overflow:hidden;aspect-ratio:7/10;box-shadow:0 4px 14px rgba(0,0,0,.5);transition:transform .15s;cursor:pointer}
.gcard:active{transform:scale(.96)}
.gcard.dead img{filter:grayscale(.85) brightness(.35)}
.gcard.low{box-shadow:0 4px 14px rgba(0,0,0,.5),0 0 0 2px rgba(231,76,60,.5)}
.gcard.shake{animation:shk .3s}
.gcard.heal{animation:hl .3s}
@keyframes shk{0%,100%{transform:translateX(0)}20%{transform:translateX(-5px)}40%{transform:translateX(4px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
@keyframes hl{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}

/* Colored tier strip at top */
.gcard::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:var(--tier,#555);z-index:6;border-radius:10px 10px 0 0;box-shadow:0 1px 4px rgba(0,0,0,.4)}

.gcard img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.gcard .shade{position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.55) 0%,transparent 30%,transparent 60%,rgba(0,0,0,.2) 100%);pointer-events:none}

/* Attack: subtle colored number, no badge, no icon */
.gatk{position:absolute;top:8px;right:8px;font-size:.75rem;font-weight:800;color:var(--tier,#fff);text-shadow:0 1px 5px rgba(0,0,0,.95),0 0 4px rgba(0,0,0,.9);z-index:4;cursor:pointer;letter-spacing:.5px}
.gatk:active{transform:scale(1.2)}

/* HP circle with tier-colored border */
.ghp{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.6);color:#fff;font-size:1.05rem;font-weight:700;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;z-index:3;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);border:2px solid var(--tier,rgba(255,255,255,.25));font-variant-numeric:tabular-nums}
.ghp.low{border-color:var(--red)!important;color:var(--red);animation:pulseRed 1.8s infinite}
@keyframes pulseRed{0%,100%{box-shadow:0 0 0 0 rgba(231,76,60,.4)}50%{box-shadow:0 0 0 6px rgba(231,76,60,0)}}
.gcard.dead .ghp{text-decoration:line-through;opacity:.4}
.gko{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) rotate(-15deg);font-size:.9rem;font-weight:900;color:rgba(220,40,40,.9);border:2px solid rgba(220,40,40,.6);border-radius:4px;padding:2px 8px;z-index:4;pointer-events:none;letter-spacing:1px}

.gbtns{position:absolute;bottom:0;left:0;right:0;display:flex;height:22%;z-index:3}
.gbtn{flex:1;border:none;background:transparent;color:#fff;font-size:1rem;font-weight:700;display:flex;align-items:center;justify-content:center}
.gbtn:active{filter:brightness(1.5)}
.gbtn.minus{background:linear-gradient(0deg,rgba(192,57,43,.65),rgba(192,57,43,0))}
.gbtn.plus{background:linear-gradient(0deg,rgba(39,174,96,.65),rgba(39,174,96,0))}
.gcard.dead .gbtn.minus{display:none}
.gcard.dead .gbtn.plus{background:linear-gradient(0deg,rgba(39,174,96,.85),rgba(39,174,96,.25));font-size:.65rem;letter-spacing:1px}

/* ===== ZOOM — HERO LAYOUT ===== */
#zoom{position:fixed;inset:0;z-index:100;background:#000;display:flex;flex-direction:column;opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s}
#zoom.open{opacity:1;visibility:visible}

.zhero{position:relative;flex:1;overflow:hidden;min-height:0}
.zhero-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center top;transition:filter .3s}
.zhero-img.dead{filter:grayscale(.85) brightness(.3)}
.zhero-img.shake{animation:zshk .3s}
.zhero-img.heal{animation:zhl .3s}
@keyframes zshk{0%,100%{transform:translateX(0) scale(1)}20%{transform:translateX(-8px) scale(1.01)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(2px)}}
@keyframes zhl{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}

.zfade{position:absolute;bottom:0;left:0;right:0;height:50%;background:linear-gradient(0deg,#000 0%,rgba(0,0,0,.95) 12%,rgba(0,0,0,.7) 35%,rgba(0,0,0,.3) 65%,transparent 100%);pointer-events:none}

.ztop-bar{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:12px 16px;padding-top:calc(14px + env(safe-area-inset-top));z-index:10;background:linear-gradient(180deg,rgba(0,0,0,.55) 0%,transparent 100%)}
.ztop-info{display:flex;align-items:center;gap:10px}
.zatk{background:rgba(232,196,106,.15);color:var(--gold);font-size:.75rem;padding:4px 12px;border-radius:8px;font-weight:600;border:1px solid rgba(232,196,106,.25);cursor:pointer}
.zrank{color:rgba(255,255,255,.55);font-size:.7rem;letter-spacing:2px;text-transform:uppercase}
.zclose{width:34px;height:34px;border-radius:50%;border:none;background:rgba(0,0,0,.5);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:#ccc;font-size:1.1rem;cursor:pointer;flex-shrink:0}
.zclose:active{background:rgba(255,255,255,.15)}

.zko-hero{position:absolute;top:38%;left:50%;transform:translate(-50%,-50%) rotate(-14deg);font-family:Georgia,serif;font-size:1.6rem;font-weight:900;letter-spacing:5px;color:rgba(220,40,40,.9);border:3px solid rgba(220,40,40,.6);border-radius:6px;padding:5px 16px;z-index:8;pointer-events:none;text-transform:uppercase;box-shadow:0 0 40px rgba(220,40,40,.4);display:none}

.zpanel{flex-shrink:0;background:#000;padding:12px 20px;padding-bottom:calc(14px + env(safe-area-inset-bottom))}
.zhp-row{display:flex;align-items:baseline;justify-content:center;gap:6px;margin-bottom:8px}
.zhp-num{font-size:2.6rem;font-weight:800;color:#fff;line-height:1;font-variant-numeric:tabular-nums;transition:color .3s}
.zhp-num.low{color:var(--red)}
.zhp-sep{font-size:1.2rem;color:#333}
.zhp-max{font-size:.85rem;color:#555}
.zhp-bar{height:5px;background:rgba(255,255,255,.06);border-radius:3px;overflow:hidden;margin-bottom:14px}
.zhp-bar-fill{height:100%;border-radius:3px;transition:width .3s,background .3s}

.zbtns{display:flex;gap:12px;margin-bottom:10px}
.zbtn{flex:1;height:56px;border:none;border-radius:14px;font-size:1.6rem;font-weight:800;color:#fff;cursor:pointer;transition:transform .1s;box-shadow:0 4px 12px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center}
.zbtn:active{transform:scale(.93)}
.zbtn.minus{background:linear-gradient(135deg,#a93226,#e74c3c)}
.zbtn.plus{background:linear-gradient(135deg,#1e8449,#2ecc71)}
.zbtn.heal-mode{font-size:1rem;letter-spacing:1px;background:linear-gradient(135deg,#16a085,#2ecc71)}

.znav{display:flex;align-items:center;justify-content:center;gap:24px}
.znav-btn{width:36px;height:36px;border-radius:50%;border:none;background:rgba(255,255,255,.06);color:#888;font-size:1.2rem;cursor:pointer;display:flex;align-items:center;justify-content:center}
.znav-btn:active{background:rgba(255,255,255,.12)}
.zcount{font-size:.7rem;color:#555;font-variant-numeric:tabular-nums}
</style>
</head>
<body>

<div class="header">
  <h1>Régicide</h1>
  <div class="progress">
    <span id="defeated" style="color:var(--gold);font-weight:600">0</span><span style="color:#555">/18</span>
    <div class="bar"><div class="bar-fill" id="bar-fill" style="width:0%"></div></div>
  </div>
  <button class="reset-btn" id="reset">RESET</button>
</div>

<div class="grid" id="grid"></div>

<div id="zoom">
  <div class="zhero">
    <img class="zhero-img" id="z-img" src="">
    <div class="zfade"></div>
    <div class="ztop-bar">
      <div class="ztop-info">
        <span class="zatk" id="z-atk">⚔ 10</span>
        <span class="zrank" id="z-rank">Valet</span>
      </div>
      <button class="zclose" id="z-close">✕</button>
    </div>
    <div class="zko-hero" id="z-ko">Vaincu</div>
  </div>
  <div class="zpanel">
    <div class="zhp-row">
      <span class="zhp-num" id="z-hp">20</span>
      <span class="zhp-sep">/</span>
      <span class="zhp-max" id="z-hp-max">20 PV</span>
    </div>
    <div class="zhp-bar"><div class="zhp-bar-fill" id="z-bar"></div></div>
    <div class="zbtns">
      <button class="zbtn minus" id="z-minus">−</button>
      <button class="zbtn plus" id="z-plus">+</button>
    </div>
    <div class="znav">
      <button class="znav-btn" id="z-prev">‹</button>
      <span class="zcount" id="z-count">1 / 18</span>
      <button class="znav-btn" id="z-next">›</button>
    </div>
  </div>
</div>

<script>
const FILES=['file_00000000004081f487a947298dc06fbf.jpg','file_00000000065481f488fe86b7ba0a9a4c.jpg','file_000000000cf48210b7c9822c111fa8d4.jpg','file_00000000108081f4ab2570a8e94d6c1b.jpg','file_00000000151881f4b90340cca64e6f81.jpg','file_0000000030f081f49ec83a0831339577.jpg','file_0000000036e881f4a9b0a8881c90206d.jpg','file_0000000037a882468b34523578043fdd.jpg','file_000000005a608243b49b12172bed91ea.jpg','file_00000000607882438689a04f0863f47c.jpg','file_000000007a348246938de5d2557966ff.jpg','file_00000000a5988243a99239d6f0568c62.jpg','file_00000000aeac8246a959c30d91cbb89f.jpg','file_00000000d2a8824381321d4fae1c1eeb.jpg','file_00000000d5cc81f4b45fb76b1a1365ed.jpg','file_00000000da0081f48f347caddfd8239f.jpg','file_00000000eb0c81f497d59fe19ead6a9e.jpg','file_00000000f9f081f4b0c190fae02d5a58.jpg']
const TYPES={'10':{name:'Valet',hp:20},'15':{name:'Dame',hp:30},'20':{name:'Roi',hp:40}}
const ATKS=[10,15,20]
const N=FILES.length
const state={}
let zoomId=null

function tierColor(atk){return atk===10?'#27ae60':atk===15?'#e8c46a':'#e74c3c'}

function init(){
  FILES.forEach((f,i)=>{state[i]={id:i,file:f,atk:10,hp:20,max:20}})
  const saved=localStorage.getItem('regicide-v2')
  if(saved){try{const d=JSON.parse(saved);for(const k in d){if(state[k]){state[k].atk=d[k].atk;state[k].hp=d[k].hp;state[k].max=TYPES[d[k].atk].hp}}}catch(e){}}
}
function save(){const d={};for(const k in state)d[k]={atk:state[k].atk,hp:state[k].hp};localStorage.setItem('regicide-v2',JSON.stringify(d))}

// ===== GRID =====
function renderGrid(){
  let h=''
  for(let i=0;i<N;i++){
    const c=state[i],dead=c.hp<=0,low=!dead&&c.hp/c.max<=.3
    h+=`<div class="gcard ${dead?'dead':''} ${low?'low':''}" data-id="${i}" style="--tier:${tierColor(c.atk)}">
<img src="cards/${c.file}" alt="" loading="lazy"><div class="shade"></div>
<span class="gatk" data-id="${i}">${c.atk}</span>
<span class="ghp ${low?'low':''}">${c.hp}</span>
${dead?'<span class="gko">KO</span>':''}
<div class="gbtns"><button class="gbtn minus" data-id="${i}" data-act="minus">−</button><button class="gbtn plus" data-id="${i}" data-act="plus">+</button></div>
</div>`
  }
  document.getElementById('grid').innerHTML=h
  updateProgress()
}

function updateCard(i){
  const el=document.querySelector(`.gcard[data-id="${i}"]`)
  if(!el)return
  const c=state[i],dead=c.hp<=0,low=!dead&&c.hp/c.max<=.3
  el.className=`gcard ${dead?'dead':''} ${low?'low':''}`
  el.style.setProperty('--tier',tierColor(c.atk))
  const hpEl=el.querySelector('.ghp');hpEl.textContent=c.hp;hpEl.className=`ghp ${low?'low':''}`
  el.querySelector('.gatk').textContent=c.atk
  const koEl=el.querySelector('.gko')
  if(dead&&!koEl)el.insertAdjacentHTML('beforeend','<span class="gko">KO</span>')
  if(!dead&&koEl)koEl.remove()
  updateProgress();save()
}

function updateProgress(){
  const d=Object.values(state).filter(c=>c.hp<=0).length
  document.getElementById('defeated').textContent=d
  document.getElementById('bar-fill').style.width=(d/N*100)+'%'
}

function changeHP(i,delta){
  const c=state[i]
  c.hp=Math.max(0,Math.min(c.max,c.hp+delta))
  if(navigator.vibrate)navigator.vibrate(delta<0?18:8)
  updateCard(i)
  if(zoomId!==null)updateZoom()
}

function cycleAtk(i){
  const c=state[i]
  c.atk=ATKS[(ATKS.indexOf(c.atk)+1)%3]
  c.max=TYPES[c.atk].hp;c.hp=c.max
  if(navigator.vibrate)navigator.vibrate(10)
  updateCard(i);if(zoomId!==null)updateZoom();save()
}

// ===== ZOOM =====
function openZoom(i){zoomId=i;updateZoom();document.getElementById('zoom').classList.add('open')}
function closeZoom(){zoomId=null;document.getElementById('zoom').classList.remove('open')}

function updateZoom(){
  if(zoomId===null)return
  const c=state[zoomId],dead=c.hp<=0,pct=Math.max(0,c.hp/c.max),low=!dead&&pct<=.25
  document.getElementById('z-img').src=`cards/${c.file}`
  document.getElementById('z-img').className=`zhero-img ${dead?'dead':''}`
  document.getElementById('z-atk').textContent=`⚔ ${c.atk}`
  document.getElementById('z-rank').textContent=TYPES[c.atk].name
  const hpEl=document.getElementById('z-hp')
  hpEl.textContent=c.hp;hpEl.className=`zhp-num ${low?'low':''}`
  document.getElementById('z-hp-max').textContent=c.max+' PV'
  const barColor=dead?'#444':pct>.5?'#2ecc71':pct>.25?'#f39c12':'#e74c3c'
  const bar=document.getElementById('z-bar')
  bar.style.width=(pct*100)+'%';bar.style.background=barColor
  document.getElementById('z-ko').style.display=dead?'block':'none'
  const mBtn=document.getElementById('z-minus'),pBtn=document.getElementById('z-plus')
  if(dead){mBtn.style.display='none';pBtn.classList.add('heal-mode');pBtn.textContent='↻ SOIGNER'}
  else{mBtn.style.display='';pBtn.classList.remove('heal-mode');pBtn.textContent='+'}
  document.getElementById('z-count').textContent=`${zoomId+1} / ${N}`
}

function zoomNav(dir){zoomId=(zoomId+dir+N)%N;updateZoom();if(navigator.vibrate)navigator.vibrate(5)}

function zoomAnim(type){
  const img=document.getElementById('z-img')
  img.classList.remove('shake','heal');void img.offsetWidth;img.classList.add(type)
  setTimeout(()=>img.classList.remove(type),320)
}

// ===== EVENTS =====
document.getElementById('grid').addEventListener('click',e=>{
  const btn=e.target.closest('.gbtn')
  if(btn){e.stopPropagation();const id=+btn.dataset.id;changeHP(id,btn.dataset.act==='plus'?1:-1)
    const card=btn.closest('.gcard');card.classList.add(btn.dataset.act==='plus'?'heal':'shake')
    setTimeout(()=>card.classList.remove('shake','heal'),320);return}
  const atk=e.target.closest('.gatk')
  if(atk){e.stopPropagation();cycleAtk(+atk.dataset.id);return}
  const card=e.target.closest('.gcard')
  if(card)openZoom(+card.dataset.id)
})

document.getElementById('z-close').addEventListener('click',closeZoom)
document.getElementById('z-minus').addEventListener('click',()=>{if(zoomId===null)return;changeHP(zoomId,-1);zoomAnim('shake')})
document.getElementById('z-plus').addEventListener('click',()=>{if(zoomId===null)return;changeHP(zoomId,1);zoomAnim('heal')})
document.getElementById('z-atk').addEventListener('click',()=>cycleAtk(zoomId))
document.getElementById('z-prev').addEventListener('click',()=>zoomNav(-1))
document.getElementById('z-next').addEventListener('click',()=>zoomNav(1))

document.getElementById('reset').addEventListener('click',()=>{
  if(!confirm('Remettre tous les PV au maximum ?'))return
  for(const k in state)state[k].hp=state[k].max
  renderGrid();if(zoomId!==null)updateZoom();save()
})

let tsx=0,tsy=0
document.getElementById('zoom').addEventListener('touchstart',e=>{
  if(e.target.closest('.zbtn,.zclose,.zatk,.znav-btn'))return
  tsx=e.touches[0].clientX;tsy=e.touches[0].clientY
},{passive:true})
document.getElementById('zoom').addEventListener('touchend',e=>{
  if(e.target.closest('.zbtn,.zclose,.zatk,.znav-btn'))return
  const dx=e.changedTouches[0].clientX-tsx,dy=e.changedTouches[0].clientY-tsy
  if(Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>60)zoomNav(dx>0?-1:1)
  else if(dy>100&&Math.abs(dx)<80)closeZoom()
},{passive:true})

init();renderGrid()
</script>
</body>
</html>
