<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0f0f1e">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="PKcards — Découvrez plus de 160 jeux de cartes. Swiper, découvrir, sauvegarder vos jeux favoris.">
  <title>PKcards — 160+ jeux de cartes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🃏</text></svg>">
</head>
<body>

<!-- ========================= APP ========================= -->
<div id="app">

  <!-- HEADER -->
  <header class="header">
    <div class="header__brand">
      <span class="header__icon">🃏</span>
      <span class="header__title">PK<span>cards</span></span>
    </div>
    <div class="header__actions">
      <button class="chip chip--icon" id="searchBtn" aria-label="Rechercher un jeu">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      </button>
      <button class="chip" id="filterBtn" aria-label="Filtrer">
        <span id="filterLabel">Tous</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <button class="chip chip--fav" id="favBtn" aria-label="Favoris">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7-4.5-9.5-9C1 9 2.5 5 6 5c2 0 3.5 1 4 2.5C10.5 6 12 5 14 5c3.5 0 5 4 3.5 7-2.5 4.5-9.5 9-9.5 9z"/></svg>
        <span class="chip__count" id="favCount">0</span>
      </button>
    </div>
  </header>

  <!-- PROGRESS -->
  <div class="progress">
    <span class="progress__count"><span id="curIdx">1</span><span class="progress__sep">/</span><span id="totalIdx">55</span></span>
    <div class="progress__track">
      <div class="progress__bar" id="progressBar"></div>
    </div>
  </div>

  <!-- CARD STACK -->
  <main class="stage" id="stage">
    <div class="card-stack" id="cardStack"></div>

    <!-- EMPTY STATE -->
    <div class="empty" id="emptyState" hidden>
      <div class="empty__icon">🎉</div>
      <h2 class="empty__title">Vous avez tout vu !</h2>
      <p class="empty__sub"><span id="likedCount">0</span> jeu(x) dans vos favoris</p>
      <div class="empty__actions">
        <button class="btn btn--primary" id="restartBtn">↻ Recommencer</button>
        <button class="btn btn--ghost" id="viewFavBtn">♥ Voir mes favoris</button>
      </div>
    </div>
  </main>

  <!-- CONTROLS -->
  <nav class="dock" id="dock">
    <button class="dock__btn dock__btn--sm" id="rewindBtn" aria-label="Revenir">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M3 7v6h6M3 13a9 9 0 1 0 3-7"/></svg>
    </button>
    <button class="dock__btn dock__btn--pass" id="passBtn" aria-label="Passer">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <button class="dock__btn dock__btn--info" id="infoBtn" aria-label="Règles">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
    </button>
    <button class="dock__btn dock__btn--like" id="likeBtn" aria-label="J'aime">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7-4.5-9.5-9C1 9 2.5 5 6 5c2 0 3.5 1 4 2.5C10.5 6 12 5 14 5c3.5 0 5 4 3.5 7-2.5 4.5-9.5 9-9.5 9z"/></svg>
    </button>
  </nav>

</div>

<!-- ========================= MODAL: DETAIL ========================= -->
<div class="sheet" id="detailSheet" hidden>
  <div class="sheet__overlay" data-close></div>
  <div class="sheet__panel">
    <div class="sheet__grabber"></div>
    <button class="sheet__close" data-close aria-label="Fermer">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <div class="sheet__body" id="detailBody"></div>
  </div>
</div>

<!-- ========================= MODAL: FAVORITES ========================= -->
<div class="sheet" id="favSheet" hidden>
  <div class="sheet__overlay" data-close></div>
  <div class="sheet__panel">
    <div class="sheet__grabber"></div>
    <button class="sheet__close" data-close aria-label="Fermer">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <h2 class="sheet__title">♥ Mes favoris</h2>
    <div class="sheet__body">
      <div class="fav-grid" id="favGrid"></div>
    </div>
  </div>
</div>

<!-- ========================= MODAL: FILTER ========================= -->
<div class="sheet" id="filterSheet" hidden>
  <div class="sheet__overlay" data-close></div>
  <div class="sheet__panel sheet__panel--sm">
    <div class="sheet__grabber"></div>
    <h2 class="sheet__title">Filtrer par catégorie</h2>
    <div class="sheet__body">
      <div class="filter-list" id="filterList"></div>
    </div>
  </div>
</div>

<!-- ========================= MODAL: SEARCH ========================= -->
<div class="sheet" id="searchSheet" hidden>
  <div class="sheet__overlay" data-close></div>
  <div class="sheet__panel">
    <div class="sheet__grabber"></div>
    <button class="sheet__close" data-close aria-label="Fermer">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <div class="search-bar">
      <svg class="search-bar__icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input type="search" id="searchInput" class="search-bar__input" placeholder="Rechercher un jeu…" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search">
    </div>
    <div class="sheet__body">
      <div class="search-results" id="searchResults"></div>
    </div>
  </div>
</div>

<!-- ========================= TOAST ========================= -->
<div class="toast" id="toast" hidden></div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
